services:
  postgres:
    image: postgres:18
    container_name: llmapif-postgres
    environment:
      POSTGRES_DB: llmapif
      POSTGRES_USER: llmapif
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - postgres_password
    volumes:
      - llmapif-postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U llmapif -d llmapif"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  llmapif:
    build: .
    container_name: llmapif
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "3001:3001"
    volumes:
      - ./config/llmapif.json:/app/config/llmapif.json:ro
    restart: unless-stopped

volumes:
  llmapif-postgres:

secrets:
  postgres_password:
    file: ./.secrets/postgres_password
